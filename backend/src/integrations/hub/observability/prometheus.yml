global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: icc-hub
    metrics_path: /internal/hub/metrics
    params:
      format: [prom]
    scrape_timeout: 5s
    static_configs:
      - targets:
          - host.docker.internal:3001
        labels:
          service: omni-inline
      - targets:
          - host.docker.internal:3010
        labels:
          service: hub-standalone
