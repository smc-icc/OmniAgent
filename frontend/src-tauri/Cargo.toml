[package]
name = "omniagent"
version = "0.1.0"
description = "OmniAgent 智能客服客户端"
authors = ["sm-cloud"]
edition = "2021"

[lib]
name = "omniagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
